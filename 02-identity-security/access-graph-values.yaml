# Teleport Access Graph (Identity Security)
# Chart: teleport/teleport-access-graph (versioned independently of Teleport)
# Docs:  https://goteleport.com/docs/reference/helm-reference/teleport-access-graph/
#
# Requires an Enterprise license with the Identity Security entitlement.
# Uses the access_graph database on the same CNPG Postgres as Teleport.

# The secret's "uri" key holds a libpq URI with password auth — created in
# the README, pointing at the access_graph database from cnpg-cluster.yaml.
postgres:
  secretName: teleport-access-graph-postgres   # key: uri

# Access Graph always serves TLS. This cert's SAN must equal the Service DNS
# name that Teleport's access_graph.endpoint uses — generated by
# ../demo-pki/make-certs.sh, signed by the same demo CA Teleport already trusts.
tls:
  existingSecretName: teleport-access-graph-tls

replicaCount: 1

# One more required value is injected at install time because it can't be
# static: clusterHostCAs — Teleport's own host CA, so Access Graph trusts
# connections from the Auth Service. The README passes it with:
#   --set-file 'clusterHostCAs[0]=../demo-pki/out/teleport-host-ca.pem'
