# Teleport on OpenShift — Helm values
#
# Backend: SQLite (standalone) | TLS: publicly trusted CA (Option B) | Service: ClusterIP
# External access: OpenShift Routes (passthrough) — see route-passthrough.yaml
#
# Use this file when your certificate is issued by a publicly trusted CA
# (purchased cert, Let's Encrypt, DigiCert, ...). For a private/corporate
# PKI use values-corporate-pki.yaml; for the self-signed demo CA use
# values-self-signed.yaml.
#
# CLUSTER_NAME must equal the Route hostname exactly. It is permanent —
# cannot be changed post-install without wiping all data and starting over.
# Mismatch causes tsh login to fail with "missing selected ALPN property"
# after password+OTP succeed (Teleport's cert won't cover the Route hostname,
# ALPN negotiation breaks, grpc-go 1.67+ rejects the connection).
#
# Get your Route hostname:
#   APPS_DOMAIN=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')
#   echo "teleport.$APPS_DOMAIN"   # e.g. teleport.apps.example.com
#
# Replace all placeholders before installing (KUBE_CLUSTER_NAME must come first):
#   sed -i.bak \
#     -e "s/KUBE_CLUSTER_NAME/${KUBE_CLUSTER_NAME}/g" \
#     -e "s/CLUSTER_NAME/${CLUSTER_NAME}/g" \
#     values-public-ca.yaml && rm values-public-ca.yaml.bak
#
# Install:
#   helm install teleport-cluster teleport/teleport-cluster \
#     --namespace teleport \
#     --version 18.10.1 \
#     --values values-public-ca.yaml

chartMode: standalone
clusterName: CLUSTER_NAME          # REPLACE — permanent, must match Route hostname
kubeClusterName: KUBE_CLUSTER_NAME # REPLACE — friendly name shown in the Teleport UI

proxyListenerMode: multiplex    # All protocols on port 443 via ALPN.
                                # Required — without this tsh login fails at
                                # the gRPC cert step even with passthrough Route.

enterprise: true

acme: false
tls:
  existingSecretName: teleport-tls   # kubectl create secret tls — chain + key (Step 4B)
  # No CA secret here: the container's Mozilla bundle already trusts public
  # CAs. If your CA's root is very new, verify the chain against the image's
  # bundle BEFORE installing (Option B in the README) — the fix for a
  # too-new root is appending the CA's cross-signed root to chain.crt,
  # not a CA secret.

auth:
  teleportConfig:
    app_service:
      enabled: true
      debug_app: true   # registers a demo app ("dumper") — proves Application
                        # Access end-to-end via Step 8's wildcard Route; harmless
                        # (and just unreachable) if you skip Step 8
    proxy_service:
      public_addr: "CLUSTER_NAME:443"   # REPLACE — must match Route hostname.
                                        # Teleport embeds this in issued certs
                                        # and join tokens.
    auth_service:
      authentication:
        type: local
        webauthn:
          rp_id: CLUSTER_NAME   # REPLACE — must equal clusterName

persistence:
  enabled: true
  volumeSize: 10Gi   # chart key is volumeSize, not size

highAvailability:
  replicaCount: 1   # SQLite does not support multiple replicas

podSecurityPolicy:
  enabled: false    # PSPs removed in OpenShift 4.x

service:
  type: ClusterIP   # No LoadBalancer — OpenShift Route is the external entry point
