# Teleport on OpenShift — Helm values
#
# Backend: SQLite (standalone) | TLS: private/corporate PKI (Option C) | Service: ClusterIP
# External access: OpenShift Routes (passthrough) — see route-passthrough.yaml
#
# Use this file when your certificate is issued by a PRIVATE or CORPORATE
# CA (internal PKI). It differs from values-public-ca.yaml in exactly one
# way: the tls block also mounts your CA bundle into the Teleport pods.
#
# Why that's required: at startup the Proxy Service verifies its own
# configured certificate chain against the CONTAINER's trust store and
# exits fatally ("unable to verify HTTPS certificate chain ... x509:
# certificate signed by unknown authority", pods in CrashLoopBackOff) if
# the issuing root isn't trusted — and a corporate root is never in the
# container's Mozilla bundle. existingCASecretName mounts your CA secret
# and sets SSL_CERT_FILE, which the verification honors.
#
# IMPORTANT: SSL_CERT_FILE REPLACES the container's default Mozilla bundle
# for all outbound TLS too. Build the teleport-tls-ca secret as
#   (image CA bundle) + (your corporate root)
# per Step 4C in the README — not the corporate root alone — or outbound
# connections to public endpoints (SSO providers, webhooks) will fail.
#
# CLUSTER_NAME must equal the Route hostname exactly. It is permanent —
# cannot be changed post-install without wiping all data and starting over.
# Mismatch causes tsh login to fail with "missing selected ALPN property"
# after password+OTP succeed.
#
# Replace all placeholders before installing (KUBE_CLUSTER_NAME must come first):
#   sed -i.bak \
#     -e "s/KUBE_CLUSTER_NAME/${KUBE_CLUSTER_NAME}/g" \
#     -e "s/CLUSTER_NAME/${CLUSTER_NAME}/g" \
#     values-corporate-pki.yaml && rm values-corporate-pki.yaml.bak
#
# Install:
#   helm install teleport-cluster teleport/teleport-cluster \
#     --namespace teleport \
#     --version 18.10.1 \
#     --values values-corporate-pki.yaml

chartMode: standalone
clusterName: CLUSTER_NAME          # REPLACE — permanent, must match Route hostname
kubeClusterName: KUBE_CLUSTER_NAME # REPLACE — friendly name shown in the Teleport UI

proxyListenerMode: multiplex    # All protocols on port 443 via ALPN.
                                # Required — without this tsh login fails at
                                # the gRPC cert step even with passthrough Route.

enterprise: true

acme: false
tls:
  existingSecretName: teleport-tls        # kubectl create secret tls — chain + key (Step 4C)
  existingCASecretName: teleport-tls-ca   # kubectl create secret generic — image bundle + corporate root (Step 4C)
  existingCASecretKeyName: ca.pem         # key name inside teleport-tls-ca

auth:
  teleportConfig:
    app_service:
      enabled: true
      debug_app: true   # registers a demo app ("dumper") — proves Application
                        # Access end-to-end via Step 8's wildcard Route; harmless
                        # (and just unreachable) if you skip Step 8
    proxy_service:
      public_addr: "CLUSTER_NAME:443"   # REPLACE — must match Route hostname.
                                        # Teleport embeds this in issued certs
                                        # and join tokens.
    auth_service:
      authentication:
        type: local
        webauthn:
          rp_id: CLUSTER_NAME   # REPLACE — must equal clusterName

persistence:
  enabled: true
  volumeSize: 10Gi   # chart key is volumeSize, not size

highAvailability:
  replicaCount: 1   # SQLite does not support multiple replicas

podSecurityPolicy:
  enabled: false    # PSPs removed in OpenShift 4.x

service:
  type: ClusterIP   # No LoadBalancer — OpenShift Route is the external entry point
